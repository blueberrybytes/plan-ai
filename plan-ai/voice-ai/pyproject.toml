[project]
name = "voice-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "numpy>=1.26",
    "python-multipart>=0.0.27",
    "scipy>=1.11",
    "sentry-sdk>=2.60.0",
    "speechbrain>=1.1.0",
    "torchaudio>=2.11.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
