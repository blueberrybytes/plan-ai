# Security headers for the web app. Included at server level AND in every location
# that has its own add_header: nginx drops the parent's add_header directives in any
# block that defines one, so each such block must include this file again.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

# Enforced now: only directives that cannot break a page.
add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

# Full policy in report-only mode. Violations appear in the browser console.
# Check it with a signed-in session before moving it to the enforced header.
#   script-src   Google APIs and Picker (apis.google.com, accounts.google.com/gsi), OneDrive.js
#                (js.live.net), Firebase Analytics (googletagmanager), Microsoft Clarity.
#   style-src    MUI and Mermaid inject inline styles; Google Fonts; Google sign-in button styles.
#   img-src      https: because brand logos and website previews load images from any host.
#                Markdown images from model output are filtered in the app (SafeMarkdownImage).
#   media-src    meeting audio from our storage bucket (signed URLs) and blob: URLs.
#   connect-src  the API, Firebase Auth and Storage, Google Picker APIs, Analytics, Sentry, Clarity.
#   frame-src    Firebase Auth iframe, Google Picker and sign-in, YouTube video on the landing
#                page, PDF previews from our storage bucket.
#   worker-src   blob: workers (image compression before upload).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://apis.google.com https://accounts.google.com https://js.live.net https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https://storage.googleapis.com/plan-ai-211b8.firebasestorage.app/ https://firebasestorage.googleapis.com/v0/b/plan-ai-211b8.firebasestorage.app/; connect-src 'self' https://api.plan-ai.blueberrybytes.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://firebaselogging-pa.googleapis.com https://firebasestorage.googleapis.com/v0/b/plan-ai-211b8.firebasestorage.app/ https://storage.googleapis.com/plan-ai-211b8.firebasestorage.app/ https://www.googleapis.com https://content.googleapis.com https://apis.google.com https://accounts.google.com https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.clarity.ms; frame-src 'self' https://plan-ai-211b8.firebaseapp.com https://accounts.google.com https://docs.google.com https://drive.google.com https://content.googleapis.com https://www.youtube.com https://storage.googleapis.com/plan-ai-211b8.firebasestorage.app/; worker-src 'self' blob:; manifest-src 'self'; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
