services:
  db:
    image: postgres:16
    container_name: plan-ai-db
    environment:
      POSTGRES_USER: planai
      POSTGRES_DB: planai_db
      POSTGRES_PASSWORD: planai123
    ports:
      # 5433 on the host: 5432 is often taken by another project's Postgres.
      - "5433:5432"
    volumes:
      - plan-ai-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planai -d planai_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15
    container_name: plan-ai-qdrant
    #environment:
    # Use env var if provided, fall back to test value
    # QDRANT__SERVICE__API_KEY: planai123
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC (optional)
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: plan-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - plan-ai-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Self-hosted speech-to-text (Whisper, OpenAI-compatible API). Only used when
  # the backend runs with STT_PROVIDER=whisper. CPU image: fine for testing and
  # for the post-meeting pass; switch to the -cuda tag on a GPU host.
  # Host port 8010 because the voice service owns 8000/8001.
  whisper:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: plan-ai-whisper
    # Opt-in: a 2 GB image plus models. `yarn docker:whisper` from the root.
    profiles: ["whisper"]
    environment:
      # The models ship as float16, which CPUs can't run efficiently, so
      # CTranslate2 silently falls back to float32. int8 is 2-4x faster on
      # CPU for a negligible accuracy cost. Remove on a GPU host.
      WHISPER__COMPUTE_TYPE: int8
      WHISPER__CPU_THREADS: ${WHISPER_CPU_THREADS:-8}
      # Keep models in memory. The default unloads them after 5 idle minutes,
      # and the first sentence of the next meeting pays for the reload.
      WHISPER__TTL: -1
    ports:
      - "8010:8000"
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  plan-ai-db-data:
  qdrant-storage:
  plan-ai-redis-data:
  whisper-models:
